name: Temporary hidden-startup suggestions grouping verification

on:
  push:
    branches:
      - ci/temp-hidden-suggest-group

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Check index JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/index.js

      - name: Verify startup and UI source wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          program = Path("src/NoteKeeper/Program.cs").read_text()
          console = Path("src/NoteKeeper/Services/WindowsConsoleVisibility.cs").read_text()
          controller = Path("src/NoteKeeper/Controllers/NotesController.cs").read_text()
          vm = Path("src/NoteKeeper/ViewModels/NoteListViewModel.cs").read_text()
          view = Path("src/NoteKeeper/Views/Notes/Index.cshtml").read_text()
          pager = Path("src/NoteKeeper/Views/Notes/_Pagination.cshtml").read_text()
          js = Path("src/NoteKeeper/wwwroot/js/index.js").read_text()

          assert "WindowsConsoleVisibility.HideOwnedConsole();" in program
          assert "GetConsoleProcessList" in console
          assert "processCount != 1" in console
          assert "ShowWindow(consoleWindow, SwHide);" in console

          assert "string? groupBy = null" in controller
          assert "AvailableTags = availableTags" in controller
          assert "OrderByDescending(note =>" in controller
          assert "tagItem.Name == selectedGroupTag" in controller
          assert "public string GroupBy" in vm
          assert "public List<string> AvailableTags" in vm

          assert 'data-tag-filter-input' in view
          assert 'data-tag-suggestions' in view
          assert 'data-tag-suggestion-source' in view
          assert 'name="groupBy"' in view
          assert 'Index_GroupWithTag' in view
          assert 'Index_GroupWithoutTag' in view
          assert "groupBy=@Uri.EscapeDataString(Model.GroupBy)" in pager

          assert "getCurrentToken" in js
          assert "setRangeText" in js
          assert "selectionStart" in js
          assert "currentMatches" in js
          assert "ArrowDown" in js
          assert "tagSuggestionSource.content.querySelectorAll" in js

          print("Source wiring checks passed.")
          PY

      - name: Verify group-by query semantics with SQLite
        shell: bash
        run: |
          mkdir -p .tmp/group-tests
          cat > .tmp/group-tests/GroupTests.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/group-tests/Program.cs <<'CS'
          using Microsoft.Data.Sqlite;
          using Microsoft.EntityFrameworkCore;
          using NoteKeeper.Data;
          using NoteKeeper.Models;

          await using var connection = new SqliteConnection("Data Source=:memory:");
          await connection.OpenAsync();

          var options = new DbContextOptionsBuilder<AppDbContext>()
              .UseSqlite(connection)
              .Options;

          await using var db = new AppDbContext(options);
          await db.Database.EnsureCreatedAsync();

          Note Make(int id, string title, DateTime updated, params string[] tags) =>
              new()
              {
                  Id = id,
                  Title = title,
                  UpdatedAtUtc = updated,
                  Tags = tags.Select(name => new NoteTag { Name = name }).ToList()
              };

          db.Notes.AddRange(
              Make(1, "Old active", new DateTime(2026, 1, 1), "active"),
              Make(2, "Newest plain", new DateTime(2026, 5, 1), "work"),
              Make(3, "New active", new DateTime(2026, 4, 1), "active", "work"),
              Make(4, "Older plain", new DateTime(2026, 2, 1), "done"));
          await db.SaveChangesAsync();

          const string selectedGroupTag = "active";
          var ids = await db.Notes
              .AsNoTracking()
              .OrderByDescending(note =>
                  note.Tags.Any(tagItem => tagItem.Name == selectedGroupTag))
              .ThenByDescending(note => note.UpdatedAtUtc)
              .ThenByDescending(note => note.Id)
              .Select(note => note.Id)
              .ToArrayAsync();

          var expected = new[] { 3, 1, 2, 4 };
          if (!ids.SequenceEqual(expected))
          {
              throw new Exception(
                  $"Expected [{string.Join(",", expected)}], got [{string.Join(",", ids)}].");
          }

          Console.WriteLine("SQLite group-by ordering passed.");
          CS

          dotnet run --project .tmp/group-tests/GroupTests.csproj --configuration Release
