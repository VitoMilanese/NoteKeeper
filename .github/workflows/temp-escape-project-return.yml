name: Temporary Escape project-return verification

on:
  push:
    branches:
      - ci/temp-escape-project-return

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check editor JavaScript
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify Escape returns to current project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path("src/NoteKeeper/wwwroot/js/editor.js").read_text()
          assert "const projectId = Number(editor.dataset.projectId || 0);" in js
          assert "const projectListUrl = projectId > 0" in js
          assert "navigateAway(projectListUrl);" in js
          assert "navigateAway('/');" not in js
          print("Escape project return passed.")
          PY
