name: Temporary floating toolbar final-line verification

on:
  push:
    branches:
      - ci/temp-floating-toolbar-final-line

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify final-line reserve hooks
        shell: python
        run: |
          from pathlib import Path

          js = Path("src/NoteKeeper/wwwroot/js/editor.js").read_text(encoding="utf-8")
          css = Path("src/NoteKeeper/wwwroot/css/site.css").read_text(encoding="utf-8")

          assert "format-toolbar-spacer" in js
          assert "toolbarHeight + 12" in js
          assert "reservedWrapRect = wrap.getBoundingClientRect()" in js
          assert "body.append(topToolbar, richEditor, floatingSpacer, floatingToolbar)" in js
          assert ".format-toolbar-spacer" in css

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build
