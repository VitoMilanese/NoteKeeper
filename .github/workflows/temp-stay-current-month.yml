name: Temporary stay-current-month verification

on:
  push:
    branches:
      - ci/temp-stay-current-month

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/time.js

      - name: Verify cross-month behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path("src/NoteKeeper/wwwroot/js/time.js").read_text()

          marker = "const targetMonth ="
          start = js.index(marker)
          block = js[start:start + 1700]

          assert "window.location.href" not in block
          assert "card.remove();" in block
          assert "data-time-empty-month" in block
          assert "!days.querySelector('.time-day-card')" in block

          print("Cross-month date edit stays on the current month.")
          PY
