name: Temporary PR 2 verification
on:
  push:
    branches:
      - ci/pr2-note-preview-shortcuts-check

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/NoteKeeper.sln
      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore
