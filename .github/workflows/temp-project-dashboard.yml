name: Temporary project-dashboard verification

on:
  push:
    branches:
      - ci/temp-project-dashboard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: |
          node --check src/NoteKeeper/wwwroot/js/index.js
          node --check src/NoteKeeper/wwwroot/js/editor.js
          node --check src/NoteKeeper/wwwroot/js/projects.js

      - name: Verify legacy project migration and EF relationships
        shell: bash
        run: |
          mkdir -p .tmp/project-tests
          cat > .tmp/project-tests/ProjectTests.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/project-tests/Program.cs <<'CS'
          using Microsoft.Data.Sqlite;
          using Microsoft.EntityFrameworkCore;
          using NoteKeeper.Data;
          using NoteKeeper.Models;
          using NoteKeeper.Services;
          using NoteKeeper.ViewModels;
          using System.Text.Json;
          using System.Text.Json.Serialization;

          await using var connection = new SqliteConnection("Data Source=:memory:");
          await connection.OpenAsync();

          var legacy = connection.CreateCommand();
          legacy.CommandText = """
              CREATE TABLE "Notes" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_Notes" PRIMARY KEY AUTOINCREMENT,
                  "Title" TEXT NOT NULL,
                  "CreatedAtUtc" TEXT NOT NULL,
                  "UpdatedAtUtc" TEXT NOT NULL,
                  "Status" INTEGER NOT NULL DEFAULT 0
              );

              CREATE TABLE "NoteBlocks" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_NoteBlocks" PRIMARY KEY AUTOINCREMENT,
                  "NoteId" INTEGER NOT NULL,
                  "Type" INTEGER NOT NULL,
                  "SortOrder" INTEGER NOT NULL,
                  "TextContent" TEXT NULL,
                  "Url" TEXT NULL,
                  "LinkTitle" TEXT NULL,
                  "ImagePath" TEXT NULL,
                  "Caption" TEXT NULL,
                  CONSTRAINT "FK_NoteBlocks_Notes_NoteId"
                      FOREIGN KEY ("NoteId") REFERENCES "Notes" ("Id") ON DELETE CASCADE
              );

              CREATE TABLE "NoteTags" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_NoteTags" PRIMARY KEY AUTOINCREMENT,
                  "NoteId" INTEGER NOT NULL,
                  "Name" TEXT NOT NULL,
                  CONSTRAINT "FK_NoteTags_Notes_NoteId"
                      FOREIGN KEY ("NoteId") REFERENCES "Notes" ("Id") ON DELETE CASCADE
              );

              CREATE UNIQUE INDEX "IX_NoteTags_NoteId_Name"
                  ON "NoteTags" ("NoteId", "Name");

              INSERT INTO "Notes"
                  ("Id", "Title", "CreatedAtUtc", "UpdatedAtUtc", "Status")
              VALUES
                  (1, 'One', '2026-01-01 10:00:00', '2026-01-02 10:00:00', 0),
                  (2, 'Two', '2026-02-01 10:00:00', '2026-02-04 10:00:00', 1);
              """;
          await legacy.ExecuteNonQueryAsync();

          var options = new DbContextOptionsBuilder<AppDbContext>()
              .UseSqlite(connection)
              .Options;

          await using (var db = new AppDbContext(options))
          {
              SqliteSchemaUpgrade.Apply(db);
          }

          await using (var db = new AppDbContext(options))
          {
              var projects = await db.Projects
                  .AsNoTracking()
                  .OrderBy(x => x.Id)
                  .ToArrayAsync();

              if (projects.Length != 1 ||
                  projects[0].Name != "Default project")
              {
                  throw new Exception(
                      $"Expected one Default project, got {projects.Length}: " +
                      string.Join(",", projects.Select(x => x.Name)));
              }

              var projectId = projects[0].Id;
              var noteProjectIds = await db.Notes
                  .AsNoTracking()
                  .OrderBy(x => x.Id)
                  .Select(x => x.ProjectId)
                  .ToArrayAsync();

              if (!noteProjectIds.SequenceEqual(new[] { projectId, projectId }))
              {
                  throw new Exception(
                      $"Legacy notes were not assigned: {string.Join(",", noteProjectIds)}");
              }

              var noteCount = await db.Projects
                  .Where(x => x.Id == projectId)
                  .Select(x => x.Notes.Count)
                  .SingleAsync();

              if (noteCount != 2)
              {
                  throw new Exception($"Expected 2 notes through Project.Notes, got {noteCount}.");
              }
          }

          await using (var db = new AppDbContext(options))
          {
              SqliteSchemaUpgrade.Apply(db);
              if (await db.Projects.CountAsync() != 1)
              {
                  throw new Exception("Repeated upgrade created another project.");
              }
          }

          var transfer = new ProjectTransferDocument
          {
              Name = "Portable",
              Notes =
              [
                  new ProjectTransferNote
                  {
                      Title = "Note",
                      Status = NoteStatus.Released,
                      Blocks =
                      [
                          new NoteTransferBlock
                          {
                              Type = BlockType.Text,
                              TextContent = "#demo"
                          }
                      ]
                  }
              ]
          };

          var jsonOptions = new JsonSerializerOptions
          {
              PropertyNamingPolicy = JsonNamingPolicy.CamelCase
          };
          jsonOptions.Converters.Add(new JsonStringEnumConverter());

          var json = JsonSerializer.Serialize(transfer, jsonOptions);
          var roundTrip = JsonSerializer.Deserialize<ProjectTransferDocument>(
              json,
              jsonOptions)
              ?? throw new Exception("Project transfer round-trip failed.");

          if (roundTrip.Format != ProjectTransferDocument.ExpectedFormat ||
              roundTrip.Notes.Count != 1 ||
              roundTrip.Notes[0].Status != NoteStatus.Released)
          {
              throw new Exception("Project transfer data changed during round-trip.");
          }

          Console.WriteLine("Project migration and transfer model passed.");
          CS

          dotnet run --project .tmp/project-tests/ProjectTests.csproj --configuration Release

      - name: Verify route and UI wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          program = Path("src/NoteKeeper/Program.cs").read_text()
          notes = Path("src/NoteKeeper/Controllers/NotesController.cs").read_text()
          projects = Path("src/NoteKeeper/Controllers/ProjectsController.cs").read_text()
          index = Path("src/NoteKeeper/Views/Notes/Index.cshtml").read_text()
          edit = Path("src/NoteKeeper/Views/Notes/Edit.cshtml").read_text()
          dashboard = Path("src/NoteKeeper/Views/Projects/Index.cshtml").read_text()
          pager = Path("src/NoteKeeper/Views/Notes/_Pagination.cshtml").read_text()

          assert "{controller=Projects}/{action=Index}" in program
          assert '[HttpGet("/projects/{projectId:int}")]' in notes
          assert '[HttpGet("/projects/{projectId:int}/notes/new")]' in notes
          assert '[HttpPost("/projects/{projectId:int}/notes/import")]' in notes
          assert ".Where(note => note.ProjectId == projectId)" in notes
          assert "ProjectId = project.Id" in notes
          assert 'action="/projects/@Model.ProjectId/notes/import"' in index
          assert 'href="/projects/@Model.ProjectId/notes/new"' in index
          assert 'data-project-id="@Model.ProjectId"' in edit
          assert 'href="/projects/@Model.ProjectId"' in edit
          assert 'href="/projects/@Model.ProjectId?' in pager
          assert '[HttpPost("/projects/create")]' in projects
          assert '[HttpPost("/projects/{id:int}/rename")]' in projects
          assert '[HttpPost("/projects/{id:int}/delete")]' in projects
          assert '[HttpGet("/projects/{id:int}/export")]' in projects
          assert '[HttpPost("/projects/import")]' in projects
          assert 'data-project-rename' in dashboard

          print("Project route/UI wiring passed.")
          PY
