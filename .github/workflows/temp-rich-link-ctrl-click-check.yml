name: Temporary rich link Ctrl click verification
on:
  push:
    branches:
      - ci/pr2-rich-link-ctrl-click-check

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check editor JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify Ctrl click hook
        shell: bash
        run: |
          grep -F "hyperlink && (event.ctrlKey || event.metaKey)" src/NoteKeeper/wwwroot/js/editor.js
          grep -F "window.open(href, '_blank', 'noopener,noreferrer')" src/NoteKeeper/wwwroot/js/editor.js
          grep -F "cursor: pointer;" src/NoteKeeper/wwwroot/css/site.css

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build
