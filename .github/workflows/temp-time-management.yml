name: Temporary time-management verification

on:
  push:
    branches:
      - ci/temp-time-management

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: |
          node --check src/NoteKeeper/wwwroot/js/editor.js
          node --check src/NoteKeeper/wwwroot/js/time.js

      - name: Verify SQLite upgrade and time model
        shell: bash
        run: |
          mkdir -p .tmp/time-management-tests
          cat > .tmp/time-management-tests/TimeManagementTests.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/time-management-tests/Program.cs <<'CS'
          using Microsoft.Data.Sqlite;
          using Microsoft.EntityFrameworkCore;
          using NoteKeeper.Data;
          using NoteKeeper.Models;
          using NoteKeeper.Services;
          using NoteKeeper.ViewModels;
          using System.Text.Json;

          await using var connection = new SqliteConnection("Data Source=:memory:");
          await connection.OpenAsync();

          var legacy = connection.CreateCommand();
          legacy.CommandText = """
              CREATE TABLE "Projects" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_Projects" PRIMARY KEY AUTOINCREMENT,
                  "Name" TEXT NOT NULL,
                  "CreatedAtUtc" TEXT NOT NULL,
                  "UpdatedAtUtc" TEXT NOT NULL
              );

              CREATE TABLE "Notes" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_Notes" PRIMARY KEY AUTOINCREMENT,
                  "Title" TEXT NOT NULL,
                  "CreatedAtUtc" TEXT NOT NULL,
                  "UpdatedAtUtc" TEXT NOT NULL,
                  "Status" INTEGER NOT NULL DEFAULT 0,
                  "EstimatedTimeMinutes" INTEGER NULL,
                  "SpentTimeMinutes" INTEGER NULL,
                  "ProjectId" INTEGER NOT NULL
              );

              CREATE TABLE "NoteTags" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_NoteTags" PRIMARY KEY AUTOINCREMENT,
                  "NoteId" INTEGER NOT NULL,
                  "Name" TEXT NOT NULL
              );

              CREATE UNIQUE INDEX "IX_NoteTags_NoteId_Name"
                  ON "NoteTags" ("NoteId", "Name");

              INSERT INTO "Projects" ("Id", "Name", "CreatedAtUtc", "UpdatedAtUtc")
              VALUES (1, 'P', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

              INSERT INTO "Notes"
                  ("Id", "Title", "CreatedAtUtc", "UpdatedAtUtc", "Status",
                   "EstimatedTimeMinutes", "SpentTimeMinutes", "ProjectId")
              VALUES
                  (1, 'Task A', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 1, 480, NULL, 1),
                  (2, 'Task B', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 240, NULL, 1);
              """;
          await legacy.ExecuteNonQueryAsync();

          var options = new DbContextOptionsBuilder<AppDbContext>()
              .UseSqlite(connection)
              .Options;

          await using (var db = new AppDbContext(options))
          {
              SqliteSchemaUpgrade.Apply(db);
          }

          var noteColumns = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
          var pragma = connection.CreateCommand();
          pragma.CommandText = """PRAGMA table_info("Notes");""";
          await using (var reader = await pragma.ExecuteReaderAsync())
          {
              while (await reader.ReadAsync())
              {
                  noteColumns.Add(reader.GetString(1));
              }
          }

          if (!noteColumns.Contains("IsTimeManagementPinned"))
              throw new Exception("Pinned column missing.");

          var tableNames = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
          var tables = connection.CreateCommand();
          tables.CommandText = "SELECT name FROM sqlite_master WHERE type='table';";
          await using (var reader = await tables.ExecuteReaderAsync())
          {
              while (await reader.ReadAsync())
              {
                  tableNames.Add(reader.GetString(0));
              }
          }

          if (!tableNames.Contains("TimeManagementDays") ||
              !tableNames.Contains("TimeManagementEntries"))
          {
              throw new Exception("Time management tables missing.");
          }

          await using (var db = new AppDbContext(options))
          {
              var note = await db.Notes.SingleAsync(x => x.Id == 1);
              note.IsTimeManagementPinned = true;

              var day = new TimeManagementDay
              {
                  ProjectId = 1,
                  Date = new DateTime(2026, 9, 30),
                  Entries =
                  [
                      new TimeManagementEntry
                      {
                          NoteId = 1,
                          TaskTitle = "Task A",
                          TimeSpentMinutes = 90,
                          Comment = "First"
                      },
                      new TimeManagementEntry
                      {
                          NoteId = 1,
                          TaskTitle = "Task A",
                          TimeSpentMinutes = 30,
                          Comment = "Second"
                      }
                  ]
              };

              db.TimeManagementDays.Add(day);
              await db.SaveChangesAsync();

              var sum = await db.TimeManagementEntries
                  .Where(x => x.NoteId == 1)
                  .SumAsync(x => (int?)x.TimeSpentMinutes);

              note.SpentTimeMinutes = sum;
              await db.SaveChangesAsync();
          }

          await using (var db = new AppDbContext(options))
          {
              var note = await db.Notes.AsNoTracking().SingleAsync(x => x.Id == 1);
              if (!note.IsTimeManagementPinned || note.SpentTimeMinutes != 120)
                  throw new Exception("Pinned/spent persistence failed.");

              var day = await db.TimeManagementDays
                  .AsNoTracking()
                  .Include(x => x.Entries)
                  .SingleAsync();

              if (day.Date.Date != new DateTime(2026, 9, 30) ||
                  day.Entries.Sum(x => x.TimeSpentMinutes) != 120)
                  throw new Exception("Day entries mismatch.");
          }

          var transfer = new ProjectTransferDocument
          {
              Name = "Transfer",
              Notes =
              [
                  new ProjectTransferNote
                  {
                      Key = "1",
                      Title = "Task A",
                      IsTimeManagementPinned = true,
                      EstimatedTimeMinutes = 480,
                      SpentTimeMinutes = 120
                  }
              ],
              TimeDays =
              [
                  new ProjectTransferTimeDay
                  {
                      Date = new DateTime(2026, 9, 30),
                      Entries =
                      [
                          new ProjectTransferTimeEntry
                          {
                              NoteKey = "1",
                              TimeSpentMinutes = 120,
                              TaskTitle = "Task A",
                              Comment = "Imported"
                          }
                      ]
                  }
              ]
          };

          var json = JsonSerializer.Serialize(transfer);
          var roundTrip = JsonSerializer.Deserialize<ProjectTransferDocument>(json)
              ?? throw new Exception("Transfer deserialize failed.");

          if (!roundTrip.Notes[0].IsTimeManagementPinned ||
              roundTrip.TimeDays.Count != 1 ||
              roundTrip.TimeDays[0].Entries[0].TimeSpentMinutes != 120)
          {
              throw new Exception("Time management transfer lost data.");
          }

          Console.WriteLine("SQLite time management model passed.");
          CS

          dotnet run --project .tmp/time-management-tests/TimeManagementTests.csproj --configuration Release

      - name: Verify routes and UI wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          notes_view = Path("src/NoteKeeper/Views/Notes/Index.cshtml").read_text()
          edit = Path("src/NoteKeeper/Views/Notes/Edit.cshtml").read_text()
          editor_js = Path("src/NoteKeeper/wwwroot/js/editor.js").read_text()
          time_view = Path("src/NoteKeeper/Views/TimeManagement/Index.cshtml").read_text()
          time_ctrl = Path("src/NoteKeeper/Controllers/TimeManagementController.cs").read_text()
          notes_ctrl = Path("src/NoteKeeper/Controllers/NotesController.cs").read_text()

          assert 'href="/projects/@Model.ProjectId/time"' in notes_view
          assert 'Index_Time' in notes_view

          assert 'aria-pressed="@(Model.IsTimeManagementPinned ? "true" : "false")"' in edit
          assert "/time-pin" in editor_js
          assert "RequestVerificationToken" in editor_js
          assert "spentTime:" not in editor_js[editor_js.index("const payload = {"):editor_js.index("blocks: collectBlocks()")]

          assert "_TimeMonthPagination" in time_view
          assert time_view.count("_TimeMonthPagination") == 2
          assert 'ToString("dd/MM/yy"' in time_view
          assert 'Time_Total' in time_view
          assert 'data-time-note-search-form' in time_view

          assert '[HttpGet("/projects/{projectId:int}/time")]' in time_ctrl
          assert '[HttpPost("/projects/{projectId:int}/time/days/create")]' in time_ctrl
          assert '[HttpPost("/projects/{projectId:int}/time/days/{dayId:int}/entries/create")]' in time_ctrl
          assert '[HttpPost("/notes/{noteId:int}/time-pin")]' in time_ctrl
          assert "RecalculateNoteSpentAsync" in time_ctrl

          save_section = notes_ctrl[notes_ctrl.index('[HttpPost("/notes/save")]'):notes_ctrl.index('[HttpPost("/notes/{id:int}/delete")]')]
          assert "request.SpentTime" not in save_section
          assert "note.SpentTimeMinutes =" not in save_section

          print("Time management route/UI wiring passed.")
          PY
