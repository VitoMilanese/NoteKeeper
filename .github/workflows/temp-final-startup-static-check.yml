name: Temporary final startup and static assets verification
on:
  push:
    branches:
      - ci/pr2-final-startup-static-check

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build src/NoteKeeper.sln --configuration Release

      - name: Verify static assets copied to build output
        shell: pwsh
        run: |
          $root = "src/NoteKeeper/bin/Release/net8.0/wwwroot"
          if (-not (Test-Path "$root/css/site.css")) { throw "site.css was not copied to build output." }
          if (-not (Test-Path "$root/js/site.js")) { throw "site.js was not copied to build output." }
          if (-not (Test-Path "$root/favicon.svg")) { throw "favicon.svg was not copied to build output." }

      - name: Verify Development startup is stable and does not launch tray
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\src\NoteKeeper\bin\Release\net8.0\NoteKeeper.exe"
          $env:ASPNETCORE_ENVIRONMENT = "Development"

          for ($i = 1; $i -le 20; $i++) {
              $port = 52500 + $i
              $process = Start-Process -FilePath $exe -ArgumentList "--urls","http://127.0.0.1:$port" -PassThru
              Start-Sleep -Milliseconds 900

              if ($process.HasExited) {
                  throw "Development startup failed on run $i with exit code $($process.ExitCode)."
              }

              $tray = Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue
              if ($null -ne $tray) {
                  $tray | Stop-Process -Force -ErrorAction SilentlyContinue
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  throw "Tray helper started in Development on run $i."
              }

              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
          }

          Remove-Item Env:ASPNETCORE_ENVIRONMENT

      - name: Verify direct executable default URLs and static assets
        shell: pwsh
        run: |
          dotnet dev-certs https | Out-Host

          $exe = "$env:GITHUB_WORKSPACE\src\NoteKeeper\bin\Release\net8.0\NoteKeeper.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "notekeeper.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "notekeeper.stderr.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory "$env:RUNNER_TEMP" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          try {
              Start-Sleep -Seconds 5

              if ($process.HasExited) {
                  Write-Host "--- stdout ---"
                  if (Test-Path $stdout) { Get-Content $stdout }
                  Write-Host "--- stderr ---"
                  if (Test-Path $stderr) { Get-Content $stderr }
                  throw "Direct executable exited with code $($process.ExitCode)."
              }

              $http = Invoke-WebRequest -Uri "http://localhost:5147/" -MaximumRedirection 0 -SkipHttpErrorCheck
              if ($http.StatusCode -notin 200,307,308) {
                  throw "Unexpected HTTP status on port 5147: $($http.StatusCode)"
              }

              $css = Invoke-WebRequest -Uri "https://localhost:7147/css/site.css" -SkipCertificateCheck -UseBasicParsing
              if ($css.StatusCode -ne 200 -or $css.Content -notmatch "\.site-header") {
                  throw "site.css was not served from https://localhost:7147."
              }

              $js = Invoke-WebRequest -Uri "https://localhost:7147/js/site.js" -SkipCertificateCheck -UseBasicParsing
              if ($js.StatusCode -ne 200 -or $js.Content.Length -lt 100) {
                  throw "site.js was not served correctly."
              }

              $tray = Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue
              if ($null -eq $tray) {
                  throw "Tray helper did not start for the direct executable."
              }
          }
          finally {
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
              }
              Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
