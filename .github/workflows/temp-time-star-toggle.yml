name: Temporary time-star verification

on:
  push:
    branches:
      - ci/temp-time-star-toggle

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Check editor JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify read-only spent time and star toggle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view = Path("src/NoteKeeper/Views/Notes/Edit.cshtml").read_text()
          js = Path("src/NoteKeeper/wwwroot/js/editor.js").read_text()
          css = Path("src/NoteKeeper/wwwroot/css/site.css").read_text()

          assert 'id="spentTimeInput"' in view
          spent = view[view.index('id="spentTimeInput"'):view.index('</label>', view.index('id="spentTimeInput"'))]
          assert "readonly" in spent
          assert "placeholder=" not in spent

          estimated = view[view.index('id="estimatedTimeInput"'):view.index('</label>', view.index('id="estimatedTimeInput"'))]
          assert "placeholder=" not in estimated

          assert 'id="timeManagementStarButton"' in view
          assert 'aria-pressed="false"' in view
          assert "const timeManagementStarButton" in js
          assert "textContent = isActive ? '★' : '☆';" in js
          assert "classList.toggle('is-active', isActive)" in js
          assert ".editor-time-star.is-active" in css

          handler_start = js.index("timeManagementStarButton?.addEventListener")
          handler_end = js.index("blocksContainer.addEventListener", handler_start)
          handler = js[handler_start:handler_end]
          assert "setDirty(" not in handler

          print("Read-only spent time and non-persistent star toggle passed.")
          PY
