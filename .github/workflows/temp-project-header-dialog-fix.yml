name: Temporary project header dialog verification

on:
  push:
    branches:
      - ci/temp-project-header-dialog-fix

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Verify header text removal and rename layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          notes = Path("src/NoteKeeper/Views/Notes/Index.cshtml").read_text()
          projects = Path("src/NoteKeeper/Views/Projects/Index.cshtml").read_text()
          css = Path("src/NoteKeeper/wwwroot/css/site.css").read_text()
          en = Path("src/NoteKeeper/Resources/AppResources.resx").read_text()

          assert 'Index_HeroCopy' not in notes
          assert 'Projects_HeroCopy' not in projects
          assert 'name="Index_HeroCopy"' not in en
          assert 'name="Projects_HeroCopy"' not in en
          assert '.app-dialog-card.project-rename-dialog-card' in css
          assert 'display: flex;' in css
          assert 'flex-direction: column;' in css
          assert '.project-rename-dialog-card .app-dialog-actions' in css
          assert 'justify-content: flex-end;' in css

          generic = css.index('.app-dialog-card {')
          override = css.index('.app-dialog-card.project-rename-dialog-card')
          assert override > generic

          print("Header cleanup and rename dialog layout passed.")
          PY
