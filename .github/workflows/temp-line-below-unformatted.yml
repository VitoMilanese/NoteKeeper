name: Temporary unformatted line-below verification

on:
  push:
    branches:
      - ci/temp-line-below-unformatted-2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify unformatted-line implementation hooks
        shell: python
        run: |
          from pathlib import Path

          js = Path("src/NoteKeeper/wwwroot/js/editor.js").read_text(encoding="utf-8")
          assert "function topLevelRichNode" in js
          assert "function fragmentHasContent" in js
          assert "const plainLine = document.createElement('div')" in js
          assert "topLevelNode.after(plainLine)" in js
          assert "const continuation = topLevelNode.cloneNode(false)" in js
          assert "document.execCommand('insertLineBreak'" not in js[js.index("function addEmptyLineBelowCaret"):js.index("function insertBlockWithContinuation")]

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Real Chromium line-below scenarios
        run: |
          cat > .tmp-test-line-below.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const path = require('path');

          const editorPath = path.resolve('src/NoteKeeper/wwwroot/js/editor.js');

          function shell(blockHtml) {
            const blocks = JSON.stringify([{
              type: 1,
              textContent: '<!--NKHTML1-->' + blockHtml
            }]).replace(/</g, '\\u003c');

            return `<!doctype html>
              <html>
              <body>
                <section id="noteEditor" data-note-id="1">
                  <input name="__RequestVerificationToken" value="x">
                  <input id="titleInput" value="Test">
                  <div id="saveStatus"></div>
                  <button id="saveButton" type="button">Save</button>
                  <button id="saveButtonBottom" type="button">Save</button>
                  <input id="imageFileInput" type="file">
                  <div id="blocksContainer"></div>
                </section>
                <script id="initialBlocks" type="application/json">${blocks}</script>
                <script id="editorStrings" type="application/json">{"typeText":"Text","dragBlock":"Drag","moveUp":"Up","moveDown":"Down","removeBlock":"Remove","textPlaceholder":"Text","formatBold":"Bold","formatItalic":"Italic","formatUnderline":"Underline","formatStrike":"Strike","formatCode":"Code","formatHyperlink":"Link","formatQuote":"Quote","formatExpander":"Expander","formatDivider":"Divider","formatAddLineBelow":"Add line","formatTextSize":"Size","formatSizeSmall":"Small","formatSizeNormal":"Normal","formatSizeLarge":"Large","formatSizeExtraLarge":"XL","formatTextColor":"Color","formatList":"List","formatOrderedList":"Ordered","formatBulletList":"Bullet","formatDashList":"Dash","formatSymbols":"Symbols","systemEmoji":"Emoji","expanderDelete":"Delete","expanderSummary":"Details","dividerDeleteHint":"Delete divider"}</script>
              </body>
              </html>`;
          }

          async function prepare(page, html, selector, offset) {
            await page.setContent(shell(html));
            await page.addScriptTag({ path: editorPath });

            await page.evaluate(({ selector, offset }) => {
              const rich = document.querySelector('.rich-text-editor');
              const node = rich.querySelector(selector).firstChild;
              const range = document.createRange();
              range.setStart(node, Math.min(offset, node.nodeValue.length));
              range.collapse(true);
              const selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
              rich.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, { selector, offset });

            await page.click('.format-toolbar-primary .add-line-below');
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1200, height: 800 } });

            await prepare(page, '<div>before <code>coded</code></div>', 'code', 5);
            let result = await page.evaluate(() => {
              const rich = document.querySelector('.rich-text-editor');
              return {
                tags: Array.from(rich.children).map(x => x.tagName),
                blankHtml: rich.children[1]?.innerHTML,
                codeHasBlank: !!rich.querySelector('code div, code br'),
                caretParent: window.getSelection()?.anchorNode?.parentElement?.tagName
              };
            });
            assert.deepStrictEqual(result.tags, ['DIV', 'DIV']);
            assert.strictEqual(result.blankHtml.toLowerCase(), '<br>');
            assert.strictEqual(result.codeHasBlank, false);
            assert.notStrictEqual(result.caretParent, 'CODE');

            await prepare(page, '<blockquote>quoted</blockquote>', 'blockquote', 6);
            result = await page.evaluate(() => {
              const rich = document.querySelector('.rich-text-editor');
              return {
                tags: Array.from(rich.children).map(x => x.tagName),
                blankHtml: rich.children[1]?.innerHTML,
                quoteHasBlank: !!rich.querySelector('blockquote > div:empty, blockquote > br'),
                caretInsideQuote: !!window.getSelection()?.anchorNode?.parentElement?.closest('blockquote')
              };
            });
            assert.deepStrictEqual(result.tags, ['BLOCKQUOTE', 'DIV']);
            assert.strictEqual(result.blankHtml.toLowerCase(), '<br>');
            assert.strictEqual(result.quoteHasBlank, false);
            assert.strictEqual(result.caretInsideQuote, false);

            await prepare(page, '<blockquote><div>first</div><div>second</div></blockquote>', 'blockquote > div:first-child', 5);
            result = await page.evaluate(() => {
              const rich = document.querySelector('.rich-text-editor');
              return {
                tags: Array.from(rich.children).map(x => x.tagName),
                texts: Array.from(rich.children).map(x => x.textContent),
                blankHtml: rich.children[1]?.innerHTML
              };
            });
            assert.deepStrictEqual(result.tags, ['BLOCKQUOTE', 'DIV', 'BLOCKQUOTE']);
            assert.strictEqual(result.texts[0], 'first');
            assert.strictEqual(result.blankHtml.toLowerCase(), '<br>');
            assert.strictEqual(result.texts[2], 'second');

            await browser.close();
            console.log('Chromium unformatted line-below scenarios passed.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node .tmp-test-line-below.cjs
