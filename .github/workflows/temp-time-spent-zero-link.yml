name: Temporary Time spent zero/link verification

on:
  push:
    branches:
      - ci/temp-time-spent-zero-link

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/time.js

      - name: Verify duration zero semantics
        shell: bash
        run: |
          mkdir -p .tmp/time-zero-tests
          cat > .tmp/time-zero-tests/TimeZeroTests.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/time-zero-tests/Program.cs <<'CS'
          using NoteKeeper.Services;

          static void AssertParse(string? text, int? expected)
          {
              if (!JiraDuration.TryParse(text, out var actual) ||
                  actual != expected)
              {
                  throw new Exception(
                      $"Parse '{text}' expected {expected?.ToString() ?? "null"}, got {actual?.ToString() ?? "invalid/null"}.");
              }
          }

          AssertParse("", null);
          AssertParse("   ", null);
          AssertParse("0h", 0);
          AssertParse("0m", 0);
          AssertParse("1h 30m", 90);

          if (JiraDuration.TryParse("1р", out _))
              throw new Exception("1р must be invalid.");

          if (JiraDuration.Format(0) != "0h")
              throw new Exception("Zero must format as 0h.");

          Console.WriteLine("Time zero semantics passed.");
          CS

          dotnet run --project .tmp/time-zero-tests/TimeZeroTests.csproj --configuration Release

      - name: Verify UI behavior wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ctrl = Path("src/NoteKeeper/Controllers/TimeManagementController.cs").read_text()
          projects = Path("src/NoteKeeper/Controllers/ProjectsController.cs").read_text()
          partial = Path("src/NoteKeeper/Views/TimeManagement/_TimeDay.cshtml").read_text()
          js = Path("src/NoteKeeper/wwwroot/js/time.js").read_text()
          en = Path("src/NoteKeeper/Resources/AppResources.resx").read_text()

          assert "minutes = parsed ?? 0;" in ctrl
          assert "return minutes >= 0;" in ctrl
          assert "entry.TimeSpentMinutes < 0" in projects
          assert "entry.TimeSpentMinutes <= 0" not in projects

          assert 'data-time-spent-input' in partial
          assert 'data-invalid-message="@Localizer["Time_InvalidTimeSpent"]"' in partial
          assert 'placeholder="@Localizer["Time_TimeSpentPlaceholder"]"' in partial

          new_form_start = partial.index('class="time-entry-form time-entry-new"')
          new_form_end = partial.index('</form>', new_form_start)
          new_form = partial[new_form_start:new_form_end]
          spent_start = new_form.index('name="timeSpent"')
          spent_end = new_form.index('/>', spent_start)
          assert "required" not in new_form[spent_start:spent_end]

          assert 'data-time-task-link' in partial
          assert 'target="_blank"' in partial
          assert 'rel="noopener noreferrer"' in partial
          assert 'href="@(entry.NoteId.HasValue ? $"/notes/{entry.NoteId.Value}" : "#")"' in partial

          assert "durationPattern" in js
          assert "text.length === 0 || durationPattern.test(text)" in js
          assert "event.preventDefault();" in js
          assert "input.reportValidity();" in js
          assert "updateTaskLink" in js
          assert "link.href = `/notes/${noteId}`;" in js

          assert '<data name="Time_TimeSpentPlaceholder" xml:space="preserve"><value>0h</value></data>' in en
          assert '<data name="Time_OpenTask"' in en

          print("Time spent optional validation and task-link wiring passed.")
          PY
