name: Temporary project dialog layout verification

on:
  push:
    branches:
      - ci/temp-project-dialog-layout

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Verify project layout overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path("src/NoteKeeper/wwwroot/css/site.css").read_text()
          view = Path("src/NoteKeeper/Views/Projects/Index.cshtml").read_text()

          assert ".projects-hero .hero-copy" in css
          assert "max-width: none;" in css
          assert ".project-rename-dialog {" in css
          assert "width: min(560px, calc(100vw - 28px));" in css
          assert ".project-rename-dialog-card {" in css
          assert "grid-template-columns: minmax(0, 1fr);" in css
          assert 'class="app-dialog project-rename-dialog"' in view
          print("Project hero/dialog layout wiring passed.")
          PY
