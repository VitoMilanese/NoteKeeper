name: Temporary note-status verification

on:
  push:
    branches:
      - ci/temp-note-status

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Check editor JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify note-status wiring and legacy SQLite upgrade
        shell: bash
        run: |
          mkdir -p .tmp/status-tests
          cat > .tmp/status-tests/StatusTests.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/status-tests/Program.cs <<'CS'
          using Microsoft.Data.Sqlite;
          using Microsoft.EntityFrameworkCore;
          using NoteKeeper.Data;
          using NoteKeeper.Models;
          using NoteKeeper.Services;

          static void AssertTags(NoteStatus status, params string[] expected)
          {
              var actual = NoteStatusTags.GetImplicitTags(status).ToArray();
              if (!actual.SequenceEqual(expected, StringComparer.OrdinalIgnoreCase))
              {
                  throw new Exception(
                      $"{status}: expected [{string.Join(",", expected)}], got [{string.Join(",", actual)}].");
              }
          }

          AssertTags(NoteStatus.Backlog);
          AssertTags(NoteStatus.Active, "active");
          AssertTags(NoteStatus.Done, "done");
          AssertTags(NoteStatus.Released, "done", "released");

          await using var connection = new SqliteConnection("Data Source=:memory:");
          await connection.OpenAsync();

          // Simulate an existing pre-status NoteKeeper database.
          var create = connection.CreateCommand();
          create.CommandText = """
              CREATE TABLE "Notes" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_Notes" PRIMARY KEY AUTOINCREMENT,
                  "Title" TEXT NOT NULL,
                  "CreatedAtUtc" TEXT NOT NULL,
                  "UpdatedAtUtc" TEXT NOT NULL
              );

              CREATE TABLE "NoteTags" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_NoteTags" PRIMARY KEY AUTOINCREMENT,
                  "NoteId" INTEGER NOT NULL,
                  "Name" TEXT NOT NULL,
                  CONSTRAINT "FK_NoteTags_Notes_NoteId"
                      FOREIGN KEY ("NoteId") REFERENCES "Notes" ("Id") ON DELETE CASCADE
              );

              CREATE UNIQUE INDEX "IX_NoteTags_NoteId_Name"
                  ON "NoteTags" ("NoteId", "Name");

              INSERT INTO "Notes" ("Id", "Title", "CreatedAtUtc", "UpdatedAtUtc")
              VALUES
                  (1, 'Backlog', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                  (2, 'Active', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                  (3, 'Done', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                  (4, 'Released', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

              INSERT INTO "NoteTags" ("NoteId", "Name")
              VALUES
                  (2, 'active'),
                  (3, 'done'),
                  (4, 'released');
              """;
          await create.ExecuteNonQueryAsync();

          var options = new DbContextOptionsBuilder<AppDbContext>()
              .UseSqlite(connection)
              .Options;

          await using (var db = new AppDbContext(options))
          {
              SqliteSchemaUpgrade.Apply(db);
          }

          var columns = new List<string>();
          var pragma = connection.CreateCommand();
          pragma.CommandText = """PRAGMA table_info("Notes");""";
          await using (var reader = await pragma.ExecuteReaderAsync())
          {
              while (await reader.ReadAsync())
              {
                  columns.Add(reader.GetString(1));
              }
          }

          if (!columns.Contains("Status", StringComparer.OrdinalIgnoreCase))
          {
              throw new Exception("Status column was not added.");
          }

          await using (var db = new AppDbContext(options))
          {
              var statuses = await db.Notes
                  .OrderBy(x => x.Id)
                  .Select(x => x.Status)
                  .ToArrayAsync();

              var expectedStatuses = new[]
              {
                  NoteStatus.Backlog,
                  NoteStatus.Active,
                  NoteStatus.Done,
                  NoteStatus.Released
              };

              if (!statuses.SequenceEqual(expectedStatuses))
              {
                  throw new Exception(
                      $"Backfill mismatch: [{string.Join(",", statuses)}].");
              }

              var releasedTags = await db.NoteTags
                  .Where(x => x.NoteId == 4)
                  .OrderBy(x => x.Name)
                  .Select(x => x.Name)
                  .ToArrayAsync();

              if (!releasedTags.SequenceEqual(
                      new[] { "done", "released" },
                      StringComparer.OrdinalIgnoreCase))
              {
                  throw new Exception(
                      $"Released tags mismatch: [{string.Join(",", releasedTags)}].");
              }
          }

          // Running the upgrade twice must be safe/idempotent.
          await using (var db = new AppDbContext(options))
          {
              SqliteSchemaUpgrade.Apply(db);
          }

          var controller = File.ReadAllText(
              "src/NoteKeeper/Controllers/NotesController.cs");
          var editor = File.ReadAllText(
              "src/NoteKeeper/wwwroot/js/editor.js");
          var view = File.ReadAllText(
              "src/NoteKeeper/Views/Notes/Edit.cshtml");

          if (!controller.Contains("BuildDesiredTags(note.Status, tags)") ||
              !controller.Contains("note.Status = NormalizeStatus(request.Status)") ||
              !controller.Contains("note.Tags.Any(tagItem =>") ||
              !editor.Contains("status: Number(statusSelect?.value || 0)") ||
              !view.Contains("id=\"statusSelect\""))
          {
              throw new Exception("Status UI/save/search wiring is incomplete.");
          }

          Console.WriteLine("Note-status mapping and legacy SQLite upgrade passed.");
          CS

          dotnet run --project .tmp/status-tests/StatusTests.csproj --configuration Release
