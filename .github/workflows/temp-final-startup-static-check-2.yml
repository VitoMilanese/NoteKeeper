name: Temporary final startup and static assets verification 2
on:
  push:
    branches:
      - ci/pr2-final-startup-static-check-2

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build src/NoteKeeper.sln --configuration Release

      - name: Verify Development startup 20 times without tray
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\src\NoteKeeper\bin\Release\net8.0\NoteKeeper.exe"
          $env:ASPNETCORE_ENVIRONMENT = "Development"
          Push-Location "$env:GITHUB_WORKSPACE\src\NoteKeeper"
          try {
            for ($i = 1; $i -le 20; $i++) {
              $port = 52600 + $i
              $process = Start-Process -FilePath $exe -ArgumentList "--urls","http://127.0.0.1:$port" -PassThru
              Start-Sleep -Milliseconds 900
              if ($process.HasExited) { throw "Development startup failed on run $i." }
              if (Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue) { throw "Tray helper started in Development." }
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          } finally {
            Pop-Location
            Remove-Item Env:ASPNETCORE_ENVIRONMENT
          }

      - name: Verify direct executable from unrelated working directory
        shell: pwsh
        run: |
          dotnet dev-certs https | Out-Host

          $exe = "$env:GITHUB_WORKSPACE\src\NoteKeeper\bin\Release\net8.0\NoteKeeper.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "notekeeper.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "notekeeper.stderr.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory "$env:RUNNER_TEMP" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Direct executable exited with code $($process.ExitCode)."
            }

            $http = Invoke-WebRequest -Uri "http://localhost:5147/" -MaximumRedirection 0 -SkipHttpErrorCheck
            if ($http.StatusCode -notin 200,307,308) { throw "Port 5147 did not respond." }

            $css = Invoke-WebRequest -Uri "https://localhost:7147/css/site.css" -SkipCertificateCheck -UseBasicParsing
            if ($css.StatusCode -ne 200 -or $css.Content -notmatch "\.site-header") { throw "CSS failed." }

            $js = Invoke-WebRequest -Uri "https://localhost:7147/js/site.js" -SkipCertificateCheck -UseBasicParsing
            if ($js.StatusCode -ne 200 -or $js.Content.Length -lt 100) { throw "JS failed." }

            if (-not (Test-Path "$env:GITHUB_WORKSPACE\src\NoteKeeper\bin\Release\net8.0\App_Data\notekeeper.db")) {
              throw "SQLite database was not created under the application content root."
            }

            if (-not (Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue)) {
              throw "Tray helper did not start for the direct executable."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
