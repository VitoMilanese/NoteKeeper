name: Temporary Time date and star verification

on:
  push:
    branches:
      - ci/temp-date-star-polish

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: |
          node --check src/NoteKeeper/wwwroot/js/editor.js
          node --check src/NoteKeeper/wwwroot/js/time.js

      - name: Verify date display and star styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          time_view = Path("src/NoteKeeper/Views/TimeManagement/Index.cshtml").read_text()
          time_ctrl = Path("src/NoteKeeper/Controllers/TimeManagementController.cs").read_text()
          time_js = Path("src/NoteKeeper/wwwroot/js/time.js").read_text()
          edit = Path("src/NoteKeeper/Views/Notes/Edit.cshtml").read_text()
          css = Path("src/NoteKeeper/wwwroot/css/site.css").read_text()

          form_start = time_view.index('class="time-add-day-form"')
          form_end = time_view.index('</form>', form_start) + 7
          add_day = time_view[form_start:form_end]

          assert 'type="text"' in add_day
          assert 'name="date"' in add_day
          assert 'ToString("dd/MM/yy"' in add_day
          assert 'data-time-date-text' in add_day
          assert 'data-time-date-picker' in add_day
          assert add_day.count('type="date"') == 1

          assert 'string? date' in time_ctrl
          assert '"dd/MM/yy"' in time_ctrl
          assert 'Time_InvalidDate' in time_ctrl
          assert 'date = date.AddYears(100);' in time_ctrl

          assert 'formatPickerValue' in time_js
          assert 'parseDisplayValue' in time_js
          assert 'match[2]' in time_js
          assert 'match[3]' in time_js

          star_line = next(
              line for line in edit.splitlines()
              if 'class="editor-time-star' in line
          )
          assert 'icon-button' not in star_line

          star_start = css.index('.editor-time-star {')
          star_end = css.index('.add-block-bar', star_start)
          star_css = css[star_start:star_end]
          assert 'border: 0;' in star_css
          assert 'background: transparent;' in star_css
          assert 'font-size: 1.72rem;' in star_css
          assert '.editor-time-star.is-active' in star_css

          print("Fixed date display and icon-only star checks passed.")
          PY
