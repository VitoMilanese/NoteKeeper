name: Temporary Jira time-tracking verification

on:
  push:
    branches:
      - ci/temp-jira-time-tracking

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Check editor JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify Jira duration parser and SQLite upgrade
        shell: bash
        run: |
          mkdir -p .tmp/time-tests
          cat > .tmp/time-tests/TimeTests.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/time-tests/Program.cs <<'CS'
          using Microsoft.Data.Sqlite;
          using Microsoft.EntityFrameworkCore;
          using NoteKeeper.Data;
          using NoteKeeper.Models;
          using NoteKeeper.Services;
          using NoteKeeper.ViewModels;
          using System.Text.Json;

          static void Parse(string text, int expected)
          {
              if (!JiraDuration.TryParse(text, out var actual) ||
                  actual != expected)
              {
                  throw new Exception(
                      $"Parse '{text}' expected {expected}, got {actual?.ToString() ?? "invalid"}.");
              }
          }

          static void Invalid(string text)
          {
              if (JiraDuration.TryParse(text, out _))
              {
                  throw new Exception($"Expected '{text}' to be invalid.");
              }
          }

          Parse("1w", 2400);
          Parse("2d", 960);
          Parse("3h", 180);
          Parse("15m", 15);
          Parse("1h 30m", 90);
          Parse("1h30m", 90);
          Parse("1d 4h", 720);
          Parse("1w 2d 3h 15m", 3555);
          Parse("1W 2D 3H 15M", 3555);
          Parse("1 h 30 m", 90);
          Parse("0m", 0);

          if (!JiraDuration.TryParse("", out var empty) || empty is not null)
              throw new Exception("Empty duration should map to null.");

          if (JiraDuration.Format(null) != "")
              throw new Exception("Null duration should format as empty.");

          if (JiraDuration.Format(90) != "1h 30m")
              throw new Exception("90m should format as 1h 30m.");

          if (JiraDuration.Format(3555) != "1w 2d 3h 15m")
              throw new Exception("Combined duration format mismatch.");

          Invalid("1x");
          Invalid("1h 30");
          Invalid("-1h");
          Invalid("1.5h");
          Invalid("1h + 30m");
          Invalid("999999999999999999w");

          await using var connection = new SqliteConnection("Data Source=:memory:");
          await connection.OpenAsync();

          var legacy = connection.CreateCommand();
          legacy.CommandText = """
              CREATE TABLE "Projects" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_Projects" PRIMARY KEY AUTOINCREMENT,
                  "Name" TEXT NOT NULL,
                  "CreatedAtUtc" TEXT NOT NULL,
                  "UpdatedAtUtc" TEXT NOT NULL
              );

              CREATE TABLE "Notes" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_Notes" PRIMARY KEY AUTOINCREMENT,
                  "Title" TEXT NOT NULL,
                  "CreatedAtUtc" TEXT NOT NULL,
                  "UpdatedAtUtc" TEXT NOT NULL,
                  "Status" INTEGER NOT NULL DEFAULT 0,
                  "ProjectId" INTEGER NOT NULL
              );

              CREATE TABLE "NoteTags" (
                  "Id" INTEGER NOT NULL CONSTRAINT "PK_NoteTags" PRIMARY KEY AUTOINCREMENT,
                  "NoteId" INTEGER NOT NULL,
                  "Name" TEXT NOT NULL
              );

              CREATE UNIQUE INDEX "IX_NoteTags_NoteId_Name"
                  ON "NoteTags" ("NoteId", "Name");

              INSERT INTO "Projects" ("Id", "Name", "CreatedAtUtc", "UpdatedAtUtc")
              VALUES (1, 'Legacy', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

              INSERT INTO "Notes"
                  ("Id", "Title", "CreatedAtUtc", "UpdatedAtUtc", "Status", "ProjectId")
              VALUES
                  (1, 'Old note', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 1);
              """;
          await legacy.ExecuteNonQueryAsync();

          var options = new DbContextOptionsBuilder<AppDbContext>()
              .UseSqlite(connection)
              .Options;

          await using (var db = new AppDbContext(options))
          {
              SqliteSchemaUpgrade.Apply(db);
          }

          var columns = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
          var pragma = connection.CreateCommand();
          pragma.CommandText = """PRAGMA table_info("Notes");""";
          await using (var reader = await pragma.ExecuteReaderAsync())
          {
              while (await reader.ReadAsync())
              {
                  columns.Add(reader.GetString(1));
              }
          }

          if (!columns.Contains("EstimatedTimeMinutes") ||
              !columns.Contains("SpentTimeMinutes"))
          {
              throw new Exception("Time tracking columns were not added.");
          }

          await using (var db = new AppDbContext(options))
          {
              var note = await db.Notes.SingleAsync();
              if (note.EstimatedTimeMinutes is not null ||
                  note.SpentTimeMinutes is not null)
              {
                  throw new Exception("Legacy note should start with null time values.");
              }

              note.EstimatedTimeMinutes = 720;
              note.SpentTimeMinutes = 90;
              await db.SaveChangesAsync();
          }

          await using (var db = new AppDbContext(options))
          {
              var note = await db.Notes.AsNoTracking().SingleAsync();
              if (note.EstimatedTimeMinutes != 720 ||
                  note.SpentTimeMinutes != 90)
              {
                  throw new Exception("Time values did not persist.");
              }
          }

          var noteTransfer = new NoteTransferDocument
          {
              Title = "Transfer",
              EstimatedTimeMinutes = 720,
              SpentTimeMinutes = 90
          };
          var noteJson = JsonSerializer.Serialize(noteTransfer);
          var noteRoundTrip = JsonSerializer.Deserialize<NoteTransferDocument>(noteJson)
              ?? throw new Exception("Note transfer deserialize failed.");

          if (noteRoundTrip.EstimatedTimeMinutes != 720 ||
              noteRoundTrip.SpentTimeMinutes != 90)
          {
              throw new Exception("Note transfer lost time values.");
          }

          var projectTransfer = new ProjectTransferDocument
          {
              Name = "P",
              Notes =
              [
                  new ProjectTransferNote
                  {
                      Title = "N",
                      EstimatedTimeMinutes = 720,
                      SpentTimeMinutes = 90
                  }
              ]
          };
          var projectJson = JsonSerializer.Serialize(projectTransfer);
          var projectRoundTrip =
              JsonSerializer.Deserialize<ProjectTransferDocument>(projectJson)
              ?? throw new Exception("Project transfer deserialize failed.");

          if (projectRoundTrip.Notes[0].EstimatedTimeMinutes != 720 ||
              projectRoundTrip.Notes[0].SpentTimeMinutes != 90)
          {
              throw new Exception("Project transfer lost time values.");
          }

          Console.WriteLine("Jira duration and SQLite upgrade passed.");
          CS

          dotnet run --project .tmp/time-tests/TimeTests.csproj --configuration Release

      - name: Verify editor/controller wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          view = Path("src/NoteKeeper/Views/Notes/Edit.cshtml").read_text()
          js = Path("src/NoteKeeper/wwwroot/js/editor.js").read_text()
          notes = Path("src/NoteKeeper/Controllers/NotesController.cs").read_text()
          projects = Path("src/NoteKeeper/Controllers/ProjectsController.cs").read_text()

          assert 'id="estimatedTimeInput"' in view
          assert 'id="spentTimeInput"' in view
          assert "estimatedTime: estimatedTimeInput?.value" in js
          assert "spentTime: spentTimeInput?.value" in js
          assert "JiraDuration.TryParse(" in notes
          assert "EstimatedTimeMinutes = note.EstimatedTimeMinutes" in notes
          assert "SpentTimeMinutes = note.SpentTimeMinutes" in notes
          assert "EstimatedTimeMinutes = note.EstimatedTimeMinutes" in projects
          assert "SpentTimeMinutes = note.SpentTimeMinutes" in projects

          print("Time tracking UI/controller wiring passed.")
          PY
