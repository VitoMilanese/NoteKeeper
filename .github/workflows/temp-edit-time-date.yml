name: Temporary edit Time date verification

on:
  push:
    branches:
      - ci/temp-edit-time-date

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/time.js

      - name: Verify date-edit wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ctrl = Path("src/NoteKeeper/Controllers/TimeManagementController.cs").read_text()
          partial = Path("src/NoteKeeper/Views/TimeManagement/_TimeDay.cshtml").read_text()
          index = Path("src/NoteKeeper/Views/TimeManagement/Index.cshtml").read_text()
          js = Path("src/NoteKeeper/wwwroot/js/time.js").read_text()

          assert '[HttpPost("/projects/{projectId:int}/time/days/{dayId:int}/date")]' in ctrl
          assert "Time_DateAlreadyExists" in ctrl
          assert 'Response.Headers["X-Time-Day-Month"]' in ctrl
          assert '"_TimeDay"' in ctrl

          assert 'data-time-day-date-edit' in partial
          assert 'data-time-day-date-form' in partial
          assert 'data-time-day-date-cancel' in partial
          assert 'name="date"' in partial
          assert 'ToString("dd/MM/yy"' in partial

          assert 'data-project-id="@Model.ProjectId"' in index

          assert "positionDay" in js
          assert "setEditMode" in js
          assert "X-Time-Day-Month" in js
          assert "card.replaceWith(updatedDay)" in js
          assert "positionDay(updatedDay)" in js
          assert "window.location.href" in js

          print("Time date editing wiring passed.")
          PY
