name: Temporary image block verification
on:
  push:
    branches:
      - ci/pr2-image-blocks-check

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check editor JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify editor behavior hooks
        shell: bash
        run: |
          grep -F "blocksContainer.appendChild(block);" src/NoteKeeper/wwwroot/js/editor.js
          grep -F "image-preview-button" src/NoteKeeper/wwwroot/js/editor.js
          grep -F "openImagePreview(block)" src/NoteKeeper/wwwroot/js/editor.js
          grep -F "data-add-image-button" src/NoteKeeper/Views/Notes/Edit.cshtml
          test "$(grep -o 'data-add-image-button' src/NoteKeeper/Views/Notes/Edit.cshtml | wc -l)" -eq 2
          test "$(grep -o 'data-add-block="text"' src/NoteKeeper/Views/Notes/Edit.cshtml | wc -l)" -eq 2
          test "$(grep -o 'data-add-block="link"' src/NoteKeeper/Views/Notes/Edit.cshtml | wc -l)" -eq 2

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build
