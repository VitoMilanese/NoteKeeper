name: Temporary hyperlink undo verification
on:
  push:
    branches:
      - ci/pr2-hyperlink-undo-check

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check editor JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/editor.js

      - name: Verify undoable hyperlink editing path
        shell: bash
        run: |
          grep -F "function hyperlinkHtml" src/NoteKeeper/wwwroot/js/editor.js
          test "$(grep -F "document.execCommand('insertHTML', false" src/NoteKeeper/wwwroot/js/editor.js | wc -l)" -ge 4
          grep -F "hyperlink creation/editing as a native undoable editing transaction" src/NoteKeeper/wwwroot/js/editor.js
          ! grep -F "range.insertNode(link);" src/NoteKeeper/wwwroot/js/editor.js
          grep -F "event.stopImmediatePropagation();" src/NoteKeeper/wwwroot/js/editor.js

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build
