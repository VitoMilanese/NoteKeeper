name: Temporary rich text and theme verification
on:
  push:
    branches:
      - ci/pr2-richtext-theme-dialog-check

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/NoteKeeper/wwwroot/js/site.js
          node --check src/NoteKeeper/wwwroot/js/editor.js
      - name: Restore
        run: dotnet restore src/NoteKeeper.sln
      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore
