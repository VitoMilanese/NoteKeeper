name: Temporary edit-date calendar verification

on:
  push:
    branches:
      - ci/temp-edit-time-calendar

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/time.js

      - name: Verify shared calendar control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("src/NoteKeeper/Views/TimeManagement/Index.cshtml").read_text()
          partial = Path("src/NoteKeeper/Views/TimeManagement/_TimeDay.cshtml").read_text()
          js = Path("src/NoteKeeper/wwwroot/js/time.js").read_text()
          css = Path("src/NoteKeeper/wwwroot/css/site.css").read_text()

          assert 'data-time-date-control' in index
          assert 'data-time-date-control' in partial
          assert 'data-time-date-text' in partial
          assert 'data-time-date-picker' in partial
          assert 'type="date"' in partial
          assert 'ToString("yyyy-MM-dd"' in partial
          assert 'ToString("dd/MM/yy"' in partial

          assert "document.addEventListener('change'" in js
          assert "data-time-date-picker" in js
          assert "data-time-date-text" in js
          assert "closest('[data-time-date-control]')" in js

          assert ".time-day-date-control" in css
          assert ".time-date-picker-shell" in css

          print("Shared Add/Edit calendar control passed.")
          PY
