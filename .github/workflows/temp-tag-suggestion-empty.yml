name: Temporary tag suggestion empty-state verification

on:
  push:
    branches:
      - ci/temp-tag-suggestion-empty

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check src/NoteKeeper/wwwroot/js/index.js

      - name: Check empty-query behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path("src/NoteKeeper/wwwroot/js/index.js").read_text()
          assert "if (query.length === 0)" in js
          assert "hideTagSuggestions();" in js
          assert "startsWith(query)" in js
          print("Empty-query autocomplete behavior passed.")
          PY
