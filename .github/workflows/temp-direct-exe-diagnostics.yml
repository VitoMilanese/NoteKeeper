name: Temporary direct executable diagnostics
on:
  push:
    branches:
      - ci/pr2-direct-exe-diagnostics

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release
      - name: Run direct executable and inspect endpoints
        shell: pwsh
        run: |
          dotnet dev-certs https | Out-Host

          $exe = "$env:GITHUB_WORKSPACE\src\NoteKeeper\bin\Release\net8.0\NoteKeeper.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "notekeeper.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "notekeeper.stderr.log"
          $process = Start-Process -FilePath $exe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          try {
              Start-Sleep -Seconds 8

              Write-Host "Process exited: $($process.HasExited)"
              if ($process.HasExited) {
                  Write-Host "Exit code: $($process.ExitCode)"
              }

              Write-Host "--- stdout ---"
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "--- stderr ---"
              if (Test-Path $stderr) { Get-Content $stderr }

              Write-Host "--- listening ports for process ---"
              Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                  Where-Object OwningProcess -eq $process.Id |
                  Format-Table -AutoSize | Out-Host

              if ($process.HasExited) {
                  throw "Direct executable exited."
              }

              $http = Invoke-WebRequest -Uri "http://localhost:5147/" -MaximumRedirection 0 -SkipHttpErrorCheck
              Write-Host "HTTP 5147 status: $($http.StatusCode)"

              $css = Invoke-WebRequest -Uri "https://localhost:7147/css/site.css" -SkipCertificateCheck -UseBasicParsing
              Write-Host "HTTPS CSS status: $($css.StatusCode), length: $($css.Content.Length)"
              if ($css.StatusCode -ne 200 -or $css.Content -notmatch "\.site-header") {
                  throw "CSS not served correctly from default HTTPS endpoint."
              }

              $js = Invoke-WebRequest -Uri "https://localhost:7147/js/site.js" -SkipCertificateCheck -UseBasicParsing
              if ($js.StatusCode -ne 200 -or $js.Content.Length -lt 100) {
                  throw "JS not served correctly."
              }
          }
          finally {
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
              }
              Get-Process -Name "NoteKeeper.Tray" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
