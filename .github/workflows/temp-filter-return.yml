name: Temp filter return verification

on:
  push:
    branches:
      - ci/filter-return-and-negation

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/NoteKeeper/NoteKeeper.csproj

      - name: Build
        run: dotnet build src/NoteKeeper/NoteKeeper.csproj -c Release --no-restore

      - name: JavaScript syntax
        run: |
          node --check src/NoteKeeper/wwwroot/js/editor.js
          node --check src/NoteKeeper/wwwroot/js/index.js

      - name: Legacy negation smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tagfilter-smoke
          cd /tmp/tagfilter-smoke
          dotnet new console --framework net8.0 --force >/dev/null
          cp "$GITHUB_WORKSPACE/src/NoteKeeper/Services/TagFilterParser.cs" .
          cat > Program.cs <<'EOF'
          using NoteKeeper.Services;

          static TagFilterTag FindTag(TagFilterExpression? expression, string name)
          {
              return expression switch
              {
                  TagFilterTag tag when tag.Name == name => tag,
                  TagFilterGroup group => group.Items
                      .Select(item =>
                      {
                          try { return FindTag(item, name); }
                          catch { return null; }
                      })
                      .FirstOrDefault(tag => tag is not null)
                      ?? throw new Exception($"Tag {name} not found."),
                  _ => throw new Exception($"Tag {name} not found.")
              };
          }

          var filter = TagFilterParser.Parse("done, !test");
          if (filter.Error != TagFilterError.None)
              throw new Exception("Legacy ! produced a parse error.");
          if (FindTag(filter.Expression, "done").Negated)
              throw new Exception("Positive tag became negated.");
          if (!FindTag(filter.Expression, "test").Negated)
              throw new Exception("!test was not negated.");

          var groupFilter = TagFilterParser.Parse("!(tn, dsde)");
          if (!FindTag(groupFilter.Expression, "tn").Negated ||
              !FindTag(groupFilter.Expression, "dsde").Negated)
              throw new Exception("Legacy ! group negation failed.");

          var repeated = TagFilterParser.Parse("-(!tn)");
          if (!FindTag(repeated.Expression, "tn").Negated)
              throw new Exception("Mixed negative prefixes toggled incorrectly.");

          Console.WriteLine("Legacy ! negation smoke tests passed.");
          EOF
          dotnet run --configuration Release
