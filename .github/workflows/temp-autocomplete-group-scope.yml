name: Temporary autocomplete/group scope verification

on:
  push:
    branches:
      - ci/temp-autocomplete-group-scope

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Verify separate tag sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controller = Path("src/NoteKeeper/Controllers/NotesController.cs").read_text()
          vm = Path("src/NoteKeeper/ViewModels/NoteListViewModel.cs").read_text()
          view = Path("src/NoteKeeper/Views/Notes/Index.cshtml").read_text()

          assert "var autocompleteTags = allTagCounts" in controller
          assert "var availableTags = filteredTagCounts" in controller
          assert "AutocompleteTags = autocompleteTags" in controller
          assert "AvailableTags = availableTags" in controller
          assert "public List<string> AutocompleteTags" in vm
          assert "Model.AutocompleteTags" in view
          assert "Model.AvailableTags" in view
          assert view.index("Model.AutocompleteTags") < view.index("Model.AvailableTags")
          print("Separate autocomplete/group tag sources are wired correctly.")
          PY

      - name: Verify global autocomplete and filtered grouping with SQLite
        shell: bash
        run: |
          mkdir -p .tmp/scope
          cat > .tmp/scope/Scope.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/NoteKeeper/NoteKeeper.csproj" />
            </ItemGroup>
          </Project>
          XML

          cat > .tmp/scope/Program.cs <<'CS'
          using Microsoft.Data.Sqlite;
          using Microsoft.EntityFrameworkCore;
          using NoteKeeper.Data;
          using NoteKeeper.Models;

          await using var connection = new SqliteConnection("Data Source=:memory:");
          await connection.OpenAsync();
          var options = new DbContextOptionsBuilder<AppDbContext>()
              .UseSqlite(connection)
              .Options;
          await using var db = new AppDbContext(options);
          await db.Database.EnsureCreatedAsync();

          Note Make(int id, params string[] tags) => new()
          {
              Id = id,
              Title = $"Note {id}",
              Tags = tags.Select(name => new NoteTag { Name = name }).ToList()
          };

          db.Notes.AddRange(
              Make(1, "atm", "done", "active"),
              Make(2, "atm", "work", "future"),
              Make(3, "other", "released"));
          await db.SaveChangesAsync();

          var allTags = await db.NoteTags
              .AsNoTracking()
              .Select(x => x.Name)
              .Distinct()
              .OrderBy(x => x)
              .ToArrayAsync();

          var filteredQuery = db.Notes
              .AsNoTracking()
              .Where(note =>
                  note.Tags.Any(tag => tag.Name == "atm") &&
                  note.Tags.Any(tag => tag.Name == "done"));

          var filteredTags = await filteredQuery
              .SelectMany(note => note.Tags)
              .Select(tag => tag.Name)
              .Distinct()
              .OrderBy(x => x)
              .ToArrayAsync();

          if (!allTags.Contains("future") || !allTags.Contains("released"))
              throw new Exception("Global autocomplete source is incomplete.");

          if (filteredTags.Contains("future") || filteredTags.Contains("released"))
              throw new Exception("Group-by source contains unrelated tags.");

          if (!filteredTags.SequenceEqual(
                  new[] { "active", "atm", "done" },
                  StringComparer.OrdinalIgnoreCase))
              throw new Exception($"Unexpected filtered tags: {string.Join(",", filteredTags)}");

          Console.WriteLine("Global autocomplete + filtered Group by scope passed.");
          CS

          dotnet run --project .tmp/scope/Scope.csproj --configuration Release
