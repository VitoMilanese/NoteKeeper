name: Temp Simple note verification

on:
  push:
    branches:
      - ci/simple-note-status

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/NoteKeeper/NoteKeeper.csproj
      - name: Build
        run: dotnet build src/NoteKeeper/NoteKeeper.csproj -c Release --no-restore
