name: Temporary first-link card verification

on:
  push:
    branches:
      - ci/temp-first-link-card

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/NoteKeeper.sln

      - name: Build
        run: dotnet build src/NoteKeeper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/NoteKeeper.sln --configuration Release --no-build

      - name: Verify first-link card wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm = Path("src/NoteKeeper/ViewModels/NoteListViewModel.cs").read_text()
          controller = Path("src/NoteKeeper/Controllers/NotesController.cs").read_text()
          view = Path("src/NoteKeeper/Views/Notes/Index.cshtml").read_text()

          assert "FirstBlockLinkUrl" in vm
          assert "GetFirstBlockLinkUrl(note.Blocks)" in controller
          assert "firstBlock?.Type != BlockType.Link" in controller
          assert 'target="_blank"' in view
          assert 'rel="noopener noreferrer"' in view
          assert 'Index_OpenFirstLink' in view

          print("First-link note-card wiring passed.")
          PY
